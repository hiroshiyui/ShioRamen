[server]
bin  = "./bin/llama-server"
host = "127.0.0.1"
port = 8080

# Gemma 4 26B-A4B — tune these per model/scenario
ngl  = 42        # GPU layers to offload; lower if VRAM is tight
ctx  = 32768     # Context window; reduce to save VRAM (e.g. 8192 for coding)

# KV cache quantization — trades a little quality for significant VRAM savings
cache_type_k = "q4_0"
cache_type_v = "q4_0"

# Performance flags
flash_attn    = true   # Faster attention; disable if you hit compatibility issues
cont_batching = true   # Better throughput when multiple requests queue up

[chat]
model       = "./models/gemma-4-e4b-it-Q8_0.gguf"
temperature = 0.1   # Low temperature for precise, deterministic coding responses

system_prompt = """
You are ShioRamen, a sharp, focused local coding assistant running entirely offline.
Be concise and accurate. Provide working code with minimal prose unless the user asks
for explanation. Always fence code blocks with the correct language identifier.
Prefer modern idioms and standard library solutions. If a question is ambiguous, ask
one clarifying question before proceeding.
"""

[paths]
models_dir = "./models"
