[package]
name = "ShioRamen"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "shio"
path = "src/main.rs"

[dependencies]
tokio       = { version = "1",    features = ["full"] }
reqwest     = { version = "0.12", features = ["json", "stream"] }
serde       = { version = "1",    features = ["derive"] }
serde_json  = "1"
clap        = { version = "4",    features = ["derive"] }
rustyline   = "15"
futures-util = "0.3"
anyhow      = "1"
