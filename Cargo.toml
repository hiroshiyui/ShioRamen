[package]
name = "ShioRamen"
version = "0.5.1"
edition = "2024"
license = "GPL-3.0-or-later"

[[bin]]
name = "shio"
path = "src/main.rs"

[dependencies]
tokio       = { version = "1",    features = ["full"] }
reqwest     = { version = "0.12", features = ["json", "stream", "blocking"] }
serde       = { version = "1",    features = ["derive"] }
serde_json  = "1"
clap        = { version = "4",    features = ["derive"] }
futures-util = "0.3"
anyhow      = "1"
toml        = "0.8"
similar     = "2"
glob        = "0.3"
regex       = "1"
ratatui          = { version = "0.30", features = ["crossterm_0_28"] }
crossterm        = { version = "0.28", features = ["event-stream"] }
textwrap         = "0.16"
unicode-width    = "0.2"
inkjet           = { version = "0.11", default-features = false, features = ["theme"] }
dirs             = "5"
arboard          = "3"
base64           = "0.22"
png              = "0.17"

[build-dependencies]
cc = "1"
